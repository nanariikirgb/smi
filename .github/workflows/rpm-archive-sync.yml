name: RPM Archive Sync

on:
  pull_request:
    paths:
      - rpm-archive-sync/**
      - .github/workflows/rpm-archive-sync.yml
  push:
    branches: [rpm-archive-sync]
    paths:
      - rpm-archive-sync/**
      - .github/workflows/rpm-archive-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build
        working-directory: rpm-archive-sync
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-archive-sync
          path: rpm-archive-sync/build/libs/rpm-archive-sync-*.jar
          if-no-files-found: error
