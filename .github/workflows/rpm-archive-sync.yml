name: RPM Archive Sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/rpm-archive-sync/src/**'
      - 'mods/rpm-archive-sync/build.gradle'
      - 'mods/rpm-archive-sync/gradle/**'
      - 'mods/rpm-archive-sync/settings.gradle'
      - '.github/workflows/rpm-archive-sync.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mods/rpm-archive-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-archive-sync
          path: |
            mods/rpm-archive-sync/build/libs/*.jar
            !mods/rpm-archive-sync/build/libs/*-sources.jar
          if-no-files-found: error
