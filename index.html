async function openPack(buffer,raw){progress(76,'Распаковка архива…');zip=await JSZip.loadAsync(buffer);progress(82,'Поиск моделей…');cache.clear();imageCache.clear();const data=new Map(),names=new Map();for(const x of raw.items||[]){const key=x.material.toLowerCase()+':'+x.customModelData;if(!names.has(key))names.set(key,[]);names.get(key).push(x)}
const paths=Object.keys(zip.files);const basePaths=paths.filter(p=>/^assets\/minecraft\/models\/item\/[^/]+\.json$/.test(p)),dynPaths=paths.filter(p=>p.endsWith('.overrides.json')&&p.includes('/dynamix/'));let done=0,total=basePaths.length+dynPaths.length;for(const p of basePaths){const d=await read(p);for(const o of d?.overrides||[])add(data,p.split('/').pop().slice(0,-5),o.predicate?.custom_model_data,o.model);progress(82+10*(++done)/Math.max(1,total),'Чтение моделей: '+done+' / '+total)}
for(const p of dynPaths){const d=await read(p);for(const o of d?.overrides||[]){if(o.type!=='ITEM')continue;for(const mat of o.items||[])add(data,mat,o.customModelData,o.models?.parent||data.get(ns(mat)+':'+o.customModelData)?.model,{textures:o.textures,source:'Dynamix'})}progress(82+10*(++done)/Math.max(1,total),'Чтение моделей: '+done+' / '+total)}
progress(93,'Сопоставление названий и категорий…');modelIndex=data;items=[...data.values()].filter(x=>!excluded.has(x.mat)&&!isStandaloneWheel(x)).map(x=>{const a=names.get(x.key)||[],v=vehicles.get(x.key),b=bags.get(x.key),f=furniture.get(x.key),reward=rewards.get(x.key)||[],community=communityItems[x.key],n=plain(community?.name||a.find(i=>plain(i.name))?.name||v?.name||(reward.length===1?reward[0].name:''));let lore=[...new Set([...(a[0]?.lore||[]),...(v?.description||[]),...(reward.length===1?reward[0].lore||[]:[])].map(plain).filter(t=>t&&!/нажми, чтобы купить/i.test(t)))];if(v?.price!=null&&!lore.some(t=>/^цена\s*:/i.test(t)))lore.push('Цена: '+Number(v.price).toLocaleString('de-DE')+'$');if(b)lore.push('Вместимость: '+b.slots+' слотов');if(f)lore.push('Группа: '+(groupNames[f.group]||f.group));if(community?.price!=null){lore=lore.filter(t=>! /^(стандартная )?цена\s*:/i.test(t));lore.push('Цена: '+Number(community.price).toLocaleString('de-DE')+'$')}if(community?.rarity){lore=lore.filter(t=>!/^\s*\[[^\]]+\]\s*$/.test(t));lore.push('['+community.rarity.replace(/^\[|\]$/g,'')+']')}return {...x,name:n||'Нет названия',named:!!n,aliases:[...new Set([...a.map(i=>plain(i.name)),...reward.map(i=>plain(i.name)),plain(v?.name)].filter(Boolean))],ids:[...new Set([...a.map(i=>i.id),...reward.map(i=>i.id),f?.id].filter(Boolean))],lore,slots:b?.slots,vehicle:!!v,cat:category(x,n)}}).filter(x=>x.cat!=='Транспорт'||(x.named&&x.name.trim().toLowerCase()!=='нет названия'));for(const x of items)x.sub=subcategory(x);items.sort((a,b)=>a.cat.localeCompare(b.cat,'ru')||a.cmd-b.cmd);$('cat').replaceChildren(new Option('Все категории',''),...[...new Set(items.map(x=>x.cat))].sort().map(x=>new Option(x,x)));updateSub();$('status').textContent='Загружено '+items.length+' кастомных записей. Превью построены по геометрии и UV-развёрткам моделей.';page=0;progress(96,'Подготовка карточек…');render()}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function render(){const token=++seq,q=$('q').value.toLowerCase().trim(),c=$('cat').value,sub=$('sub').value,n=$('named').value;let a=items.filter(x=>(!c||x.cat===c)&&(!sub||x.sub===sub)&&(!n||x.named===(n==='yes'))&&(!q||[x.name,x.key,x.model,...x.ids,...x.aliases].join(' ').toLowerCase().includes(q)));page=Math.max(0,Math.min(page,Math.ceil(a.length/size)-1));$('count').textContent='Найдено: '+a.length+' / '+items.length;$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(a.length/size));$('prev').disabled=!page;$('next').disabled=(page+1)*size>=a.length;$('grid').replaceChildren();for(const x of a.slice(page*size,(page+1)*size)){const b=el('button','tile'),p=el('div','preview','◇'),m=el('div','meta');m.append(el('span','tag',x.cat),el('strong','',x.name),cardLore(x));b.append(p,m);b.onclick=()=>detail(x);$('grid').append(b);thumb(x).then(url=>{if(url&&token===seq){const im=new Image();im.src=url;im.alt='Превью модели';p.replaceChildren(im)}})}}
const SUGGESTION_ENDPOINT='https://smi-pearl.vercel.app/api/name-suggestion';
let sendingSuggestion=false,devMode=false,lastDevClick=0,devNoticeTimer;
function refreshDev(){ $('devToggle').setAttribute('aria-pressed',String(devMode));$('info').hidden=!devMode||!active;$('copy').hidden=!devMode||!active;$('adminLink').hidden=!devMode}
$('devToggle').addEventListener('click',()=>{const now=Date.now();if(lastDevClick&&now-lastDevClick<550){lastDevClick=0;devMode=!devMode;refreshDev();const notice=$('devNotice');notice.textContent=devMode?'Режим разработчика включён':'Режим разработчика выключен';notice.hidden=false;clearTimeout(devNoticeTimer);devNoticeTimer=setTimeout(()=>notice.hidden=true,2200)}else lastDevClick=now});
refreshDev();
function setupSuggestion(x){$('suggestSection').hidden=x.named;$('suggestForm').hidden=true;$('showSuggest').hidden=false;$('suggestForm').reset();$('suggestStatus').textContent='';$('sendSuggest').disabled=sendingSuggestion}
$('showSuggest').onclick=()=>{$('showSuggest').hidden=true;$('suggestForm').hidden=false;$('suggestName').focus();if(!SUGGESTION_ENDPOINT)$('suggestStatus').textContent='Отправка будет доступна после подключения сервера.'};
$('suggestForm').onsubmit=async e=>{e.preventDefault();if(sendingSuggestion||!active||active.named)return;const item=active,name=$('suggestName').value.trim(),comment=$('suggestComment').value.trim(),honey=$('suggestHoney').value;const status=$('suggestStatus'),btn=$('sendSuggest');if(!SUGGESTION_ENDPOINT){status.textContent='Сервис отправки ещё не подключён.';return}if(name.length<2){status.textContent='Введите название предмета.';return}sendingSuggestion=true;btn.disabled=true;status.textContent='Подготовка изображения…';try{const preview=await thumb(item);if(!preview||!preview.startsWith('data:image/png;base64,'))throw Error('Не удалось подготовить превью модели.');if(active===item)status.textContent='Отправка в Discord…';const response=await fetch(SUGGESTION_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,comment,honey,key:item.key,model:item.model,category:item.cat,preview})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw Error(result.error||'Не удалось отправить предложение.');if(active===item){$('suggestForm').reset();status.textContent='Предложение отправлено! Спасибо.'}}catch(err){if(active===item)status.textContent=err.message||'Ошибка отправки.'}finally{sendingSuggestion=false;btn.disabled=false}};
async function detail(x){active=x;setupSuggestion(x);$('dn').textContent=x.name;$('pic').replaceChildren();$('info').textContent=[x.cat,x.key,'Модель: '+x.model,'ID: '+(x.ids.join(', ')||'—')].join('\n');const lore=x.lore.filter(t=>!/^группа\s*:/i.test(t));$('publicLore').textContent=lore.join('\n');$('publicLore').hidden=!lore.length;refreshDev();$('detail').showModal();const u=await thumb(x);if(u&&active===x&&$('detail').open){const i=new Image();i.src=u;$('pic').append(i)}}$('close').onclick=()=>$('detail').close();$('copy').onclick=()=>navigator.clipboard.writeText(active.key);for(const id of ['q','cat','sub','named'])$(id).addEventListener('input',()=>{if(id==='cat')updateSub();page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'})};let percent=1;function progress(n,msg){percent=Math.max(percent,Math.min(100,Math.floor(n)));$('percent').textContent=percent+'%';$('loadbar').style.width=percent+'%';$('status').textContent=msg}
async function downloadPack(){const p=await fetch('data/resourcepack.zip',{cache:'no-cache'});if(!p.ok)throw Error('resourcepack.zip: HTTP '+p.status);const total=Number(p.headers.get('content-length'));if(!p.body){const b=await p.arrayBuffer();progress(75,'Архив получен');return b}const reader=p.body.getReader(),chunks=[];let bytes=0;while(true){const {done,value}=await reader.read();if(done)break;chunks.push(value);bytes+=value.length;progress(total>0?Math.min(74,5+69*bytes/total):5,'Загрузка: '+(bytes/1048576).toFixed(1)+' МБ'+(total>0?' / '+(total/1048576).toFixed(1)+' МБ':''))}const out=new Uint8Array(bytes);let offset=0;for(const c of chunks){out.set(c,offset);offset+=c.length}progress(75,'Архив получен');return out.buffer}
async function boot(){percent=1;document.body.classList.add('loading');$('setup').hidden=false;$('retry').hidden=true;$('loadbar').style.width='1%';try{progress(2,'Подключение к GitHub…');if(typeof JSZip==='undefined')throw Error('Библиотека JSZip не загрузилась');const [buffer,raw,metadata,assemblyData,communityData]=await Promise.all([downloadPack(),fetch('data/custom-items.json',{cache:'no-cache'}).then(n=>{if(!n.ok)throw Error('custom-items.json: HTTP '+n.status);return n.json()}),fetch('data/catalog-extra.json',{cache:'no-cache'}).then(n=>{if(!n.ok)throw Error('catalog-extra.json: HTTP '+n.status);return n.json()}),fetch('data/vehicle-assemblies.json',{cache:'no-cache'}).then(n=>{if(!n.ok)throw Error('vehicle-assemblies.json: HTTP '+n.status);return n.json()}),fetch('data/community-items.json',{cache:'no-cache'}).then(n=>{if(!n.ok)throw Error('community-items.json: HTTP '+n.status);return n.json()}).catch(e=>{console.warn('Community names unavailable',e);return {items:{}}})]);communityItems=communityData.items||{};initExtra(metadata);initAssemblies(assemblyData);await openPack(buffer,raw);if(!items.length)throw Error('В архиве не найдены модели');progress(97,'Создание первых превью…');let completed=0;const first=items.slice(0,size);await Promise.allSettled(first.map(x=>thumb(x).finally(()=>progress(97+2*(++completed)/Math.max(1,first.length),'Создание превью: '+completed+' / '+first.length))));progress(100,'Каталог готов');await new Promise(r=>setTimeout(r,250));$('setup').hidden=true;document.body.classList.remove('loading')}catch(e){$('status').textContent='Ошибка загрузки: '+e.message;$('retry').hidden=false;console.error(e)}}$('retry').onclick=boot;boot();
